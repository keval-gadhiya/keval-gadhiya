name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: keval-gadhiya
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0A1220,#0F1B33,#1E3A5F,#2563EB,#38BDF8
            dist/github-snake-light.svg?color_snake=#3B82F6&color_dots=#EBEDF3,#DBEAFE,#93C5FD,#60A5FA,#3B82F6

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
