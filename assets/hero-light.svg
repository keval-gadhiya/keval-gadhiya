<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-label="Keval Gadhiya — Design Systems Engineer">
<title>Keval Gadhiya — I design the system, then I ship it.</title>
<defs>
<style><![CDATA[
.d{font-family:-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes orb{50%{transform:scale(1.09)}}
@keyframes sweep{from{transform:translateY(-60px)}to{transform:translateY(940px)}}
@keyframes gs1{50%{stop-color:#3B82F6}}
@keyframes gs2{50%{stop-color:#2563EB}}
.fu{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) forwards}
.fi{opacity:0;animation:fadeIn 1s ease forwards}
.cur{animation:blink 1.1s step-end infinite}
.orb{transform-box:fill-box;transform-origin:center;animation:orb 9s ease-in-out infinite}
.beamIn{opacity:0;animation:fadeIn 1s ease 3s forwards}
.beam{animation:sweep 10s linear 3s infinite}
.gs1{animation:gs1 9s ease-in-out infinite}
.gs2{animation:gs2 9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#F5F6FB"/><stop offset="55%" stop-color="#FBFCFE"/><stop offset="100%" stop-color="#F8F9FC"/>
</linearGradient>
<linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
  <stop class="gs1" offset="0%" stop-color="#14161D"/>
  <stop offset="55%" stop-color="#14161D"/>
  <stop class="gs2" offset="100%" stop-color="#3B82F6"/>
</linearGradient>
<linearGradient id="borderG" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#3B82F6" stop-opacity=".38"/>
  <stop offset="50%" stop-color="#E4E7F0" stop-opacity=".9"/>
  <stop offset="100%" stop-color="#2563EB" stop-opacity=".38"/>
</linearGradient>
<radialGradient id="orbV"><stop offset="0%" stop-color="#2563EB" stop-opacity=".16"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
<radialGradient id="orbB"><stop offset="0%" stop-color="#2563EB" stop-opacity=".10"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/><stop offset="100%" stop-color="#3B82F6" stop-opacity=".06"/>
</linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r=".7" fill="#14161D" opacity=".04"/></pattern>
<clipPath id="frame"><rect x="1" y="1" width="1278" height="858" rx="24"/></clipPath>
<clipPath id="tPrompt"><rect x="72" y="58" width="0" height="30"><animate attributeName="width" from="0" to="420" dur=".9s" begin=".2s" fill="freeze"/></rect></clipPath>
<clipPath id="tName"><rect x="180" y="350" width="0" height="150"><animate attributeName="width" from="0" to="920" dur="1.1s" begin=".8s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></rect></clipPath>
</defs>

<!-- ground -->
<rect width="1280" height="860" rx="24" fill="url(#bg)"/>
<rect width="1280" height="860" rx="24" fill="url(#dots)"/>
<circle class="orb" cx="1000" cy="180" r="380" fill="url(#orbV)"/>
<circle class="orb" style="animation-duration:11s" cx="250" cy="760" r="340" fill="url(#orbB)"/>
<rect x="1" y="1" width="1278" height="858" rx="24" fill="none" stroke="url(#borderG)" stroke-width="1.4"/>

<!-- terminal prompt -->
<text clip-path="url(#tPrompt)" x="72" y="78" class="m" font-size="14"><tspan fill="#1A7F37">keval@arc-ds</tspan><tspan fill="#6B7590"> ~ % </tspan><tspan fill="#5A6274">whoami</tspan></text>
<rect class="cur" x="268" y="65" width="8" height="16" fill="#1A7F37" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".1s" begin="1.1s" fill="freeze"/></rect>

<!-- centered composition -->
<text class="m fi" x="640" y="336" text-anchor="middle" font-size="13" letter-spacing="5" fill="#6B7590" style="animation-delay:.5s">DESIGN SYSTEMS · UI ENGINEERING · GERMANY</text>

<text clip-path="url(#tName)" x="640" y="462" text-anchor="middle" class="d" font-size="118" font-weight="700" letter-spacing="-4" fill="url(#nameG)">Keval Gadhiya</text>

<!-- cycling roles (crossfade) -->
<g class="m" font-size="20" fill="#3B82F6" text-anchor="middle">
  <text x="640" y="532" opacity="0">Design Systems Engineer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.01;.05;.21;.25;1" dur="24s" begin="1.6s" repeatCount="indefinite"/></text>
  <text x="640" y="532" opacity="0">Senior UI Engineer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.26;.3;.46;.5;1" dur="24s" begin="1.6s" repeatCount="indefinite"/></text>
  <text x="640" y="532" opacity="0">Product Designer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.51;.55;.71;.75;1" dur="24s" begin="1.6s" repeatCount="indefinite"/></text>
  <text x="640" y="532" opacity="0">Flutter · React · TypeScript<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.76;.8;.96;1;1" dur="24s" begin="1.6s" repeatCount="indefinite"/></text>
</g>

<text class="d fu" x="640" y="614" text-anchor="middle" font-size="25" fill="#14161D" style="animation-delay:1.4s">I design the system, then I ship it.</text>
<text class="d fu" x="640" y="654" text-anchor="middle" font-size="16" fill="#5A6274" style="animation-delay:1.6s">Component libraries, token pipelines and Figma tooling — for products used by millions.</text>

<!-- hairline divider -->
<line x1="560" y1="716" x2="720" y2="716" stroke="#E4E7F0" stroke-width="1"><animate attributeName="x1" from="640" to="560" dur=".8s" begin="2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/><animate attributeName="x2" from="640" to="720" dur=".8s" begin="2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/></line>

<!-- metrics -->
<g class="m" text-anchor="middle">
  <g class="fu" style="animation-delay:2.2s"><text x="320" y="774" font-size="16" font-weight="bold" fill="#14161D">6+</text><text x="320" y="796" font-size="11" letter-spacing="1.5" fill="#6B7590">YEARS</text></g>
  <g class="fu" style="animation-delay:2.35s"><text x="480" y="774" font-size="16" font-weight="bold" fill="#14161D">15+</text><text x="480" y="796" font-size="11" letter-spacing="1.5" fill="#6B7590">LIVE APPS</text></g>
  <g class="fu" style="animation-delay:2.5s"><text x="640" y="774" font-size="16" font-weight="bold" fill="#14161D">100+</text><text x="640" y="796" font-size="11" letter-spacing="1.5" fill="#6B7590">COMPONENTS</text></g>
  <g class="fu" style="animation-delay:2.65s"><text x="800" y="774" font-size="16" font-weight="bold" fill="#14161D">4</text><text x="800" y="796" font-size="11" letter-spacing="1.5" fill="#6B7590">FIGMA PLUGINS</text></g>
  <g class="fu" style="animation-delay:2.8s"><text x="960" y="774" font-size="16" font-weight="bold" fill="#3B82F6">MILLIONS</text><text x="960" y="796" font-size="11" letter-spacing="1.5" fill="#6B7590">OF USERS</text></g>
  <line x1="400" y1="758" x2="400" y2="798" stroke="#E4E7F0"/><line x1="560" y1="758" x2="560" y2="798" stroke="#E4E7F0"/>
  <line x1="720" y1="758" x2="720" y2="798" stroke="#E4E7F0"/><line x1="880" y1="758" x2="880" y2="798" stroke="#E4E7F0"/>
</g>

<!-- slow sweep (CSS-driven so prefers-reduced-motion disables it) -->
<g clip-path="url(#frame)" class="beamIn">
  <g class="beam">
    <rect x="0" y="-46" width="1280" height="46" fill="url(#beam)"/>
    <rect x="0" y="0" width="1280" height="1.4" fill="#3B82F6" opacity=".18"/>
  </g>
</g>
</svg>
