  </g>
  <g class="row" style="animation-delay:1.60s">
    <circle cx="26" cy="175" r="5" fill="#3B82F6"/>
    <text x="40" y="180" font-size="13" fill="#e6edf3" font-weight="bold">JavaScript</text>
    <text x="396" y="180" text-anchor="end" font-size="13" fill="#3B82F6" font-weight="bold">18%</text>
    <rect x="40" y="188" width="268" height="9" rx="4.5" fill="#132038"/>
    <rect x="40" y="188" width="0" height="9" rx="4.5" fill="#3B82F6">
      <animate attributeName="width" from="0" to="48.2" dur="1.1s" begin="1.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.95s">
    <circle cx="26" cy="217" r="5" fill="#93C5FD"/>
