      <animate attributeName="width" from="0" to="101.8" dur="1.1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.25s">
    <circle cx="26" cy="133" r="5" fill="#60A5FA"/>
    <text x="40" y="138" font-size="13" fill="#e6edf3" font-weight="bold">Dart · Flutter</text>
    <text x="396" y="138" text-anchor="end" font-size="13" fill="#60A5FA" font-weight="bold">26%</text>
    <rect x="40" y="146" width="268" height="9" rx="4.5" fill="#132038"/>
    <rect x="40" y="146" width="0" height="9" rx="4.5" fill="#60A5FA">
      <animate attributeName="width" from="0" to="69.7" dur="1.1s" begin="1.40s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
