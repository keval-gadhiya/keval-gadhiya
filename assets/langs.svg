    <rect x="40" y="230" width="0" height="9" rx="4.5" fill="#93C5FD">
      <animate attributeName="width" from="0" to="32.2" dur="1.1s" begin="2.10s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:2.25s">
    <circle cx="26" cy="252" r="5" fill="#22D3EE"/>
    <text x="40" y="257" font-size="13" fill="#e6edf3" font-weight="bold">Tooling · Config</text>
    <text x="396" y="257" text-anchor="end" font-size="13" fill="#22D3EE" font-weight="bold">6%</text>
  </g>
<g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>
