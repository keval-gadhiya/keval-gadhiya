<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" role="img" aria-label="Keval Gadhiya — profile card">
<title>Keval Gadhiya — Design Systems Engineer</title>
<!--
  PHOTO SLOT — to replace the KG monogram with your photo:
  1. sips -c 2316 2316 -cropOffset 100 0 -Z 220 -s format jpeg -s formatOptions 55 photo.jpg -o avatar.jpg
  2. base64 -i avatar.jpg | pbcopy
  3. Replace the <g id="monogram"> group below with:
     <image x="140" y="72" width="120" height="120" clip-path="url(#avClip)" href="data:image/jpeg;base64,PASTE_HERE"/>
-->
<defs>
<style><![CDATA[
.d{font-family:-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'SF Mono',Consolas,Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{0%{transform:translateX(-260px) skewX(-16deg)}55%,100%{transform:translateX(480px) skewX(-16deg)}}
@keyframes ringSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fu{opacity:0;animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards}
.card{animation:drift 8s ease-in-out infinite}
.sh{animation:shine 5.5s ease-in-out 2.5s infinite}
.ring{transform-origin:200px 132px;animation:ringSpin 14s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
<linearGradient id="pcBorder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#38BDF8" stop-opacity=".55"/>
  <stop offset="50%" stop-color="#232838"/>
  <stop offset="100%" stop-color="#60A5FA" stop-opacity=".55"/>
</linearGradient>
<linearGradient id="pcRing" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#60A5FA" stop-opacity=".15"/>
</linearGradient>
<linearGradient id="pcName" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#EDEFF7"/><stop offset="100%" stop-color="#93C5FD"/>
</linearGradient>
<linearGradient id="pcShine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="pcGlow"><stop offset="0%" stop-color="#38BDF8" stop-opacity=".14"/><stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<clipPath id="avClip"><circle cx="200" cy="132" r="58"/></clipPath>
<clipPath id="cardClip"><rect x="20" y="16" width="360" height="524" rx="20"/></clipPath>
</defs>

<circle cx="200" cy="150" r="190" fill="url(#pcGlow)"><animate attributeName="r" values="190;208;190" dur="7s" repeatCount="indefinite"/></circle>

<g class="card">
  <rect x="20" y="16" width="360" height="524" rx="20" fill="#0A1220" stroke="url(#pcBorder)" stroke-width="1.4"/>
  <rect x="20" y="16" width="360" height="524" rx="20" fill="#EDEFF7" opacity=".015"/>

  <!-- avatar ring -->
  <g class="ring"><circle cx="200" cy="132" r="64" fill="none" stroke="url(#pcRing)" stroke-width="2" stroke-dasharray="8 6"/></g>
  <circle cx="200" cy="132" r="58" fill="#0E1628" stroke="#232838" stroke-width="1"/>
  <g id="monogram">
    <text x="200" y="150" text-anchor="middle" class="d" font-size="46" font-weight="700" letter-spacing="-2" fill="url(#pcName)">KG</text>
  </g>

  <!-- identity -->
  <text class="d fu" x="200" y="238" text-anchor="middle" font-size="27" font-weight="700" letter-spacing="-.8" fill="url(#pcName)" style="animation-delay:.3s">Keval Gadhiya</text>
  <text class="m fu" x="200" y="264" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#38BDF8" style="animation-delay:.45s">DESIGN SYSTEMS ENGINEER</text>
  <text class="m fu" x="200" y="286" text-anchor="middle" font-size="12" fill="#5F6880" style="animation-delay:.6s">@keval-gadhiya · Germany · CET</text>

  <line x1="52" y1="312" x2="348" y2="312" stroke="#232838" stroke-width="1"/>

  <!-- token strip -->
  <text class="m fu" x="52" y="340" font-size="10.5" letter-spacing="2" fill="#5F6880" style="animation-delay:.7s">PERSONAL TOKENS</text>
  <g class="fu" style="animation-delay:.85s">
    <rect x="52"  y="352" width="52" height="26" rx="6" fill="#38BDF8"/>
    <rect x="112" y="352" width="52" height="26" rx="6" fill="#3B82F6"/>
    <rect x="172" y="352" width="52" height="26" rx="6" fill="#60A5FA"/>
    <rect x="232" y="352" width="52" height="26" rx="6" fill="#232838"/>
    <rect x="292" y="352" width="56" height="26" rx="6" fill="#EDEFF7"/>
    <text x="52"  y="394" class="m" font-size="9" fill="#5F6880">sky.400</text>
    <text x="112" y="394" class="m" font-size="9" fill="#5F6880">blue.500</text>
    <text x="172" y="394" class="m" font-size="9" fill="#5F6880">blue.400</text>
    <text x="232" y="394" class="m" font-size="9" fill="#5F6880">line.800</text>
    <text x="292" y="394" class="m" font-size="9" fill="#5F6880">ink.50</text>
  </g>

  <!-- focus rows -->
  <text class="m fu" x="52" y="428" font-size="10.5" letter-spacing="2" fill="#5F6880" style="animation-delay:1s">FOCUS</text>
  <g class="m" font-size="12">
    <g class="fu" style="animation-delay:1.1s"><rect x="52" y="440" width="128" height="28" rx="14" fill="none" stroke="#232838"/><text x="116" y="458" text-anchor="middle" fill="#9AA3B8">design systems</text></g>
    <g class="fu" style="animation-delay:1.2s"><rect x="188" y="440" width="76" height="28" rx="14" fill="none" stroke="#232838"/><text x="226" y="458" text-anchor="middle" fill="#9AA3B8">flutter</text></g>
    <g class="fu" style="animation-delay:1.3s"><rect x="272" y="440" width="66" height="28" rx="14" fill="none" stroke="#232838"/><text x="305" y="458" text-anchor="middle" fill="#9AA3B8">react</text></g>
    <g class="fu" style="animation-delay:1.4s"><rect x="52" y="476" width="104" height="28" rx="14" fill="none" stroke="#232838"/><text x="104" y="494" text-anchor="middle" fill="#9AA3B8">figma api</text></g>
    <g class="fu" style="animation-delay:1.5s"><rect x="164" y="476" width="98" height="28" rx="14" fill="none" stroke="#232838"/><text x="213" y="494" text-anchor="middle" fill="#9AA3B8">ai tooling</text></g>
  </g>

  <!-- status -->
  <g class="fu" style="animation-delay:1.7s">
    <circle cx="58" cy="524" r="3.5" fill="#4ADE80"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="70" y="528" class="m" font-size="11.5" fill="#9AA3B8">building Arc DS · Upstox</text>
  </g>

  <!-- shine sweep -->
  <g clip-path="url(#cardClip)"><rect class="sh" x="20" y="16" width="110" height="524" fill="url(#pcShine)"/></g>
</g>
</svg>
